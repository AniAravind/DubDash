name: Checks
on: [push, pull_request]
jobs:
  policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==8.3.5 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5' 'websockets>=14,<16'
      - run: python -m compileall -q src scripts
      - run: python -m pytest -q
  ros-build:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && rosdep update && rosdep install --from-paths src --ignore-src -r -y --rosdistro humble
      - shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/DubDashDepth/DubDashDepth.xcodeproj -scheme DubDashDepth -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath .cache/ios-build CODE_SIGNING_ALLOWED=NO build
