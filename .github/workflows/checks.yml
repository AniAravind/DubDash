name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python scripts/ci_pytest.py -q

  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate base and merged laptop configurations
        run: |
          bash -n scripts/test_laptop.sh scripts/run_container_tests.sh
          bash scripts/test_laptop.sh config
          docker compose -f compose.yaml -f compose.benchmark.yaml config --quiet
          docker compose -f compose.yaml -f compose.laptop.yaml config --format json | python3 scripts/check_laptop_compose.py
          ROBOT_CONFIG=/tmp/robot.yaml ROBOT_MAPS=/tmp/maps ROBOT_DESTINATIONS=/tmp/places.json docker compose -f compose.robot.yaml config --quiet

  ros-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    needs: compose
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mapping/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dubdash-laptop:humble
          cache-from: type=gha,scope=humble-amd64
          cache-to: type=gha,mode=max,scope=humble-amd64
      - name: Run unit and required ROS integration tests with mock service
        run: bash scripts/test_laptop.sh
        env:
          # Buildx already copied the checkout and ran colcon; don't build twice.
          LAPTOP_SKIP_BUILD: '1'
          LAPTOP_PLATFORM: linux/amd64
      - name: Build headless robot userspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/robot/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=robot-amd64
          cache-to: type=gha,mode=max,scope=robot-amd64

  arm64-build:
    # Native ARM64 on every push/PR, including the full CPU ROS driving suite.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    needs: compose
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mapping/Dockerfile
          platforms: linux/arm64
          load: true
          tags: dubdash-laptop:humble-arm64
          cache-from: type=gha,scope=humble-arm64
          cache-to: type=gha,mode=max,scope=humble-arm64
      - name: Run full ARM64 ROS integration suite
        run: bash scripts/test_laptop.sh
        env:
          LAPTOP_SKIP_BUILD: '1'
          LAPTOP_PLATFORM: linux/arm64
          LAPTOP_TEST_IMAGE: dubdash-laptop:humble-arm64
      - name: Build headless robot ARM64 userspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/robot/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=robot-arm64
          cache-to: type=gha,mode=max,scope=robot-arm64
