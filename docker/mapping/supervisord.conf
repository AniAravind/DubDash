[supervisord]
nodaemon=true
logfile=/tmp/dubdash-supervisor.log
pidfile=/tmp/dubdash-supervisor.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 +extension GLX +render -noreset -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/tmp/display.log
stderr_logfile=/tmp/display-error.log
stopasgroup=true
killasgroup=true

[program:window-manager]
command=/usr/bin/openbox
priority=20
autorestart=true
stdout_logfile=/tmp/openbox.log
stderr_logfile=/tmp/openbox-error.log
stopasgroup=true
killasgroup=true

[program:vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -nopw -forever -shared -xkb -noxdamage
priority=30
autorestart=true
stdout_logfile=/tmp/vnc.log
stderr_logfile=/tmp/vnc-error.log
stopasgroup=true
killasgroup=true

[program:browser-desktop]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc-error.log
stopasgroup=true
killasgroup=true

[program:welcome]
command=/usr/local/bin/dubdash-terminal
priority=50
autorestart=false
stdout_logfile=/tmp/terminal.log
stderr_logfile=/tmp/terminal-error.log
stopasgroup=true
killasgroup=true
